<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TMTProdAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><img src="logo.svg" alt=""> TMTProdAI</div>
    <button id="home-btn" class="ghost" hidden>New video</button>
  </header>

  <main>
    <!-- Something is missing before editing can work -->
    <section id="setup" hidden>
      <h1>Almost ready</h1>
      <ul id="checks" class="checks"></ul>
      <div class="row">
        <button id="pick-repo">Choose TMTProdAI folder</button>
        <button id="recheck" class="ghost">Check again</button>
      </div>
    </section>

    <!-- Drop zone and earlier drafts -->
    <section id="home" hidden>
      <div id="drop" class="drop">
        <div class="drop-icon">⬇</div>
        <h1>Drop a video here</h1>
        <p>It gets cut, captioned and styled the way your rules say.</p>
        <button id="pick-video">Or choose a file</button>
      </div>
      <h2 id="drafts-title" hidden>Your drafts</h2>
      <ul id="drafts" class="drafts"></ul>
    </section>

    <!-- Editing in progress -->
    <section id="editing" hidden>
      <h1 id="editing-title">Editing</h1>
      <p class="muted"><span id="editing-file"></span> · <span id="elapsed">0:00</span></p>
      <ol id="steps" class="steps"></ol>
      <p id="now" class="now"></p>
      <details>
        <summary>Details</summary>
        <ul id="log" class="log"></ul>
      </details>
      <button id="cancel" class="ghost danger">Stop</button>
    </section>

    <!-- Review the draft -->
    <section id="review" hidden>
      <div class="review">
        <div class="player"><video id="video" controls></video></div>
        <div class="side">
          <h1 id="review-title">Draft</h1>
          <div id="summary" class="summary"></div>
          <label for="notes">Notes for the next version</label>
          <textarea id="notes" rows="4" placeholder="e.g. faster, bigger captions, cut the intro"></textarea>
          <div class="row">
            <button id="send-notes">Send notes</button>
            <button id="approve" class="accent">Approve final</button>
          </div>
          <div class="row">
            <button id="play" class="ghost">Open in player</button>
            <button id="reveal" class="ghost">Show in folder</button>
          </div>
        </div>
      </div>
    </section>

    <p id="error" class="error" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
