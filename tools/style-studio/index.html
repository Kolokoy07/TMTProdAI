<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@1,500;1,700&family=Anton&family=Permanent+Marker&family=Poppins:wght@700;800&family=Caveat:wght@700&family=Archivo+Black&family=Dancing+Script:wght@700&family=Bebas+Neue&family=Satisfy&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#131315;--panel2:#1a1a1d;--line:#2a2a2e;--text:#f2f2f3;--mute:#9a9aa2;--brand:#ff6a1a;--brand2:#ff8a3d;--ok:#3ddc84}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto auto 1fr auto;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-weight:900;color:#111}
header h1{font-size:16px;margin:0;font-weight:800}header .sub{color:var(--mute);font-size:12px}
header .right{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--mute);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
nav.tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:14px 12px 12px;color:var(--mute);font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button .n{opacity:.6;margin-right:6px;font-weight:600}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--brand)}
nav.tabs button .chk{color:var(--brand);margin-left:6px}
main{display:grid;grid-template-columns:400px 1fr;gap:0;min-height:0}
.left{border-right:1px solid var(--line);padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.right{padding:26px 30px;overflow:auto}
.phone{border-radius:28px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #333,0 20px 60px rgba(0,0,0,.5);position:relative}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn:hover{border-color:#444}.btn.primary{background:var(--brand);border-color:var(--brand);color:#111}
.btn.primary:hover{background:var(--brand2)}.btn.on{border-color:var(--brand);color:var(--brand)}
.hint{color:var(--mute);font-size:12px;text-align:center}
.eyebrow{color:var(--brand);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
h2{font-size:30px;letter-spacing:-.02em;margin:6px 0 4px;font-weight:900}
.desc{color:var(--mute);margin:0 0 20px;max-width:720px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;cursor:pointer;position:relative;transition:border-color .15s,transform .15s}
.card:hover{border-color:#444;transform:translateY(-2px)}.card.on{border-color:#fff;box-shadow:0 0 0 1px #fff}
.card .mini{border-radius:12px;overflow:hidden;position:relative;background:#000}
.card .num{position:absolute;top:16px;left:16px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid #555;display:grid;place-items:center;font-size:12px;font-weight:800;z-index:5}
.card .picked{position:absolute;top:16px;right:16px;background:#fff;color:#111;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;z-index:5;display:none}
.card.on .picked{display:block}
.card h3{margin:10px 4px 2px;font-size:15px}.card p{margin:0 4px 4px;color:var(--mute);font-size:12px}
.chip{display:flex;gap:6px;margin:8px 4px 2px}.chip i{width:18px;height:18px;border-radius:50%;border:1px solid #444}
.fine{margin-top:26px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px 26px}
.fine h4{grid-column:1/-1;margin:0;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.field label{display:block;font-weight:700;margin-bottom:6px}.field small{color:var(--mute);font-weight:500}
.field input[type=text],.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.field input[type=range]{width:100%;accent-color:var(--brand)}
.field input[type=color]{width:46px;height:34px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.row{display:flex;gap:10px;align-items:center}
.toggle{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}.toggle input{accent-color:var(--brand);width:18px;height:18px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:64px;height:114px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--brand)}
.summary{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;max-width:760px}
.summary b{color:var(--mute);font-weight:700}
.saved{margin-top:18px;display:grid;gap:8px;max-width:760px}
.saved .it{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.saved .it .tag{font-size:11px;font-weight:800;color:#111;background:var(--brand);border-radius:999px;padding:1px 8px}
.saved .it .grow{flex:1}
footer{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line)}
.prog{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px}
.bar{width:180px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#111;font-weight:800;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:900px){main{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line)}}

/* ---------- the stage: 1080x1920 render coordinates, scaled down ---------- */
.stage{position:absolute;top:0;left:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#111}
.stage .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .bgfx{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .w{display:inline-block;will-change:transform,filter,opacity}
.stage .t{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.stage .hl .w{background:linear-gradient(180deg,var(--p1) 0%,var(--p1) 42%,var(--p2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .03em}
.stage .hl{font-family:var(--hf);font-weight:var(--hw);letter-spacing:var(--ht);line-height:.92;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))}
.stage .ac{font-family:var(--af);font-style:var(--as);font-weight:var(--aw);color:var(--acc);line-height:.85;filter:drop-shadow(0 6px 18px rgba(0,0,0,.65))}
.stage .sm{font-family:var(--bf);font-weight:var(--bw);color:#fff;filter:drop-shadow(0 3px 10px rgba(0,0,0,.8))}
.stage .layer{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;opacity:0}
.stage .layer.show{opacity:1}
.stage .cap{position:absolute;left:0;right:0;display:flex;justify-content:center;padding:0 70px;opacity:0}
.stage .cap.show{opacity:1}
.stage .cap span{white-space:nowrap;font-family:var(--cf);font-weight:var(--cw);color:var(--capc);line-height:1.18;text-align:center}
.stage .cap.stroke span{-webkit-text-stroke:2px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.75),0 0 4px rgba(0,0,0,.9)}
.stage .cap.box span{background:rgba(10,10,12,.82);padding:10px 26px;border-radius:18px}
.stage .cap .k{color:var(--acc)}
.stage .pill{display:inline-block;background:var(--acc);color:#111;font-family:var(--bf);font-weight:900;font-size:40px;padding:6px 20px;border-radius:12px;margin-bottom:18px}
.stage .hl.boxword .w{background:var(--acc);-webkit-background-clip:border-box;background-clip:border-box;color:#111;padding:0 .12em;border-radius:.08em;margin:0 .04em}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">S</div>
    <div><h1>Style Studio</h1><div class="sub" id="styleName">New style</div></div>
    <div class="right"><span><span class="dot"></span><span id="saveState">Not saved</span></span></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main>
    <section class="left">
      <div class="phone" id="bigPhone" style="width:340px;height:604px"></div>
      <div class="ctl">
        <button class="btn" data-scene="hook">Hook</button>
        <button class="btn" data-scene="title">Title</button>
        <button class="btn" data-scene="caption">Captions</button>
        <button class="btn primary" id="playBtn">▶ Play</button>
      </div>
      <div class="hint" id="hint">Preview frame from your newest video · Play runs hook, title, and captions with sound</div>
    </section>
    <section class="right" id="step"></section>
  </main>
  <footer>
    <button class="btn" id="backBtn">Back</button>
    <div class="prog"><span id="progTxt">Step 1 of 8</span><div class="bar"><i id="progBar"></i></div></div>
    <button class="btn primary" id="nextBtn">Next</button>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------------- options ----------------
const COLOURS = [
  { id: 'gold', name: 'Gold & White', note: 'White headline, gold accent', primary: '#ffffff', primaryEnd: '#b9b9b9', accent: '#f5c84c', caption: '#ffffff', shade: '#06070a' },
  { id: 'sunset', name: 'Sunset Orange', note: 'White headline, hot orange accent', primary: '#ffffff', primaryEnd: '#d8d8d8', accent: '#ff6a1a', caption: '#ffffff', shade: '#0a0705' },
  { id: 'marker', name: 'Marker Blue', note: 'Matches whiteboard ink', primary: '#ffffff', primaryEnd: '#c4cbd8', accent: '#7fa8ff', caption: '#ffffff', shade: '#05070c' },
  { id: 'mint', name: 'Fresh Mint', note: 'Clean and techy', primary: '#ffffff', primaryEnd: '#c9d6d0', accent: '#4ef0b0', caption: '#ffffff', shade: '#040a08' },
  { id: 'pink', name: 'Hot Pink', note: 'Loud and playful', primary: '#ffffff', primaryEnd: '#e2cfd8', accent: '#ff4fa3', caption: '#ffffff', shade: '#0b0509' },
  { id: 'mono', name: 'Mono', note: 'All white and silver', primary: '#ffffff', primaryEnd: '#9a9a9a', accent: '#e8e8e8', caption: '#ffffff', shade: '#060606' },
  { id: 'custom', name: 'Custom', note: 'Pick your own below', primary: '#ffffff', primaryEnd: '#b9b9b9', accent: '#f5c84c', caption: '#ffffff', shade: '#06070a' },
];
const FONTS = [
  { id: 'signature', name: 'Signature', note: 'Tight sans + elegant italic serif', headline: { family: 'Inter', weight: 900, tracking: -0.042, upper: false, size: 168 }, accent: { family: 'Instrument Serif', italic: true, weight: 400, size: 132 }, body: { family: 'Inter', weight: 800 } },
  { id: 'editorial', name: 'Editorial', note: 'Magazine serif headlines', headline: { family: 'DM Serif Display', weight: 400, tracking: -0.02, upper: false, size: 172 }, accent: { family: 'Playfair Display', italic: true, weight: 500, size: 112 }, body: { family: 'Inter', weight: 700 } },
  { id: 'punchy', name: 'Punchy', note: 'Tall condensed + marker script', headline: { family: 'Anton', weight: 400, tracking: 0, upper: true, size: 190 }, accent: { family: 'Permanent Marker', italic: false, weight: 400, size: 104 }, body: { family: 'Inter', weight: 800 } },
  { id: 'friendly', name: 'Friendly', note: 'Round geometric + playful script', headline: { family: 'Poppins', weight: 800, tracking: -0.03, upper: false, size: 156 }, accent: { family: 'Caveat', italic: false, weight: 700, size: 140 }, body: { family: 'Poppins', weight: 700 } },
  { id: 'classic-bold', name: 'Classic Bold', note: 'Wide heavy sans + script', headline: { family: 'Archivo Black', weight: 400, tracking: -0.02, upper: false, size: 150 }, accent: { family: 'Dancing Script', italic: false, weight: 700, size: 128 }, body: { family: 'Inter', weight: 800 } },
  { id: 'clean-caps', name: 'Clean Caps', note: 'Tall all-caps + soft script', headline: { family: 'Bebas Neue', weight: 400, tracking: 0.01, upper: true, size: 210 }, accent: { family: 'Satisfy', italic: false, weight: 400, size: 116 }, body: { family: 'Montserrat', weight: 800 } },
];
const HOOK_LAYOUTS = [
  { id: 'stacked', name: 'Stacked', note: 'Big word, accent line, small line' },
  { id: 'number', name: 'Big Number', note: 'Huge accent number leads' },
  { id: 'highlight-box', name: 'Highlight Box', note: 'Key word in a solid accent box' },
  { id: 'question', name: 'Question', note: 'Accent question on top' },
  { id: 'none', name: 'No hook text', note: 'Start straight into the video' },
];
const MOTIONS = [
  { id: 'word-blur-rise', name: 'Blur Rise', note: 'Premium: words rise out of a blur' },
  { id: 'pop', name: 'Pop', note: 'Bouncy scale-in per word' },
  { id: 'slide-up', name: 'Slide Up', note: 'Quick clean slide per word' },
  { id: 'typewriter', name: 'Typewriter', note: 'Letters type on' },
  { id: 'fade', name: 'Soft Fade', note: 'Gentle fade per word' },
];
const CAPTIONS = [
  { id: 'sentence-line', name: 'One-line sentences', note: 'Short line, breaks at each sentence' },
  { id: 'keyword-accent', name: 'Key word accent', note: 'One line, key word in accent' },
  { id: 'word-pop', name: 'Word pop', note: 'Two words at a time, bigger' },
  { id: 'boxed', name: 'Boxed', note: 'Dark box behind each line' },
  { id: 'none', name: 'No captions', note: 'Clean video' },
];
const CAP_POS = { 'above-seam': 1300, 'middle': 1000, 'lower-third': 1480, 'top': 420 };
const LAYOUTS = [
  { id: 'center-band', name: 'Center', note: 'Middle of the frame' },
  { id: 'top-bar', name: 'Top', note: 'Upper area' },
  { id: 'lower-third', name: 'Lower third', note: 'Above the caption line' },
];
const BACKINGS = [
  { id: 'soft-band', name: 'Soft band', note: 'Feathered dark band, no box' },
  { id: 'card', name: 'Card', note: 'Solid rounded card' },
  { id: 'glass', name: 'Glass', note: 'Frosted blur panel' },
  { id: 'none', name: 'None', note: 'Text and shadow only' },
];
const GRADES = { natural: 'none', warm: 'sepia(.18) saturate(1.15) hue-rotate(-8deg)', cool: 'saturate(.92) hue-rotate(12deg) brightness(1.03)', bw: 'grayscale(1) contrast(1.12)', 'teal-orange': 'sepia(.12) hue-rotate(-10deg) saturate(1.4) contrast(1.08)' };
const SFX = [
  { id: 'premium', name: 'Premium', note: 'Riser, per-word swishes, swells' },
  { id: 'punchy', name: 'Punchy', note: 'Whoosh + hit per title' },
  { id: 'minimal', name: 'Minimal', note: 'One soft swell per title' },
  { id: 'none', name: 'None', note: 'Voice and music only' },
];

const SIGNATURE_GOLD = {
  name: 'Signature Gold', slug: 'signature-gold', format: '9:16 1080x1920',
  colours: { ...COLOURS[0] }, fonts: { ...structuredClone(FONTS[0]), caption: { family: 'Inter', weight: 800 } },
  hook: { layout: 'stacked', motion: 'word-blur-rise', minSeconds: 4, maxSeconds: 5, avoidAction: true, sound: 'riser-impact' },
  captions: { style: 'sentence-line', maxChars: 26, position: 'above-seam', y: 1300, size: 56, highlight: false, box: false },
  visuals: { titleLayout: 'center-band', backing: 'soft-band', motion: 'word-blur-rise', titleMinHold: 3, grade: 'natural', pace: 'tight', punchIns: 'off' },
  extras: { sfx: 'premium', music: 'my-sounds-or-pad', musicDb: -20, ctaKeyword: 'ACTIVATE', ctaPops: true },
  sample: { hookA: '5 Levels', hookB: 'of thinking', hookC: 'sa trading. Anong level ka na?', titleA: 'Level 3', titleB: 'strategy hopping', caption: 'Sa level 3, narealize mo na hindi pala nag-work yung strategy mo. Pero kasi sa totoo lang, hindi mo lang siguro nabigyan ng time and focus.' },
};
const TABS = ['Start', 'Colours', 'Fonts', 'Hook', 'Captions', 'Visuals', 'Extras', 'Watch'];

// ---------------- state ----------------
let S = structuredClone(SIGNATURE_GOLD);
let tab = 0, visited = new Set([0]), frames = [], frameIdx = 0, saved = [], defaultSlug = null, dirty = true;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slugify = (s) => s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'my-style';
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800); };
const touch = () => { dirty = true; $('#saveState').textContent = 'Unsaved changes'; refreshBig(); };

// ---------------- stage rendering (shared by big preview and option cards) ----------------
function vars(p) {
  const c = p.colours, f = p.fonts;
  return `--p1:${c.primary};--p2:${c.primaryEnd};--acc:${c.accent};--capc:${c.caption};--shade:${c.shade};` +
    `--hf:'${f.headline.family}';--hw:${f.headline.weight};--ht:${f.headline.tracking}em;--af:'${f.accent.family}';--as:${f.accent.italic ? 'italic' : 'normal'};--aw:${f.accent.weight};` +
    `--bf:'${f.body.family}';--bw:${f.body.weight};--cf:'${f.caption.family}';--cw:${f.caption.weight}`;
}
const words = (s, cls = '') => String(s).split(' ').filter(Boolean).map((w) => `<span class="w ${cls}">${esc(w)}</span>`).join(' ');
const hex2rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
function backing(p, kind, inner, layout) {
  const sh = p.colours.shade;
  if (kind === 'card') return { layer: '', t: `background:${hex2rgba(sh, .86)};padding:40px 70px;border-radius:40px;box-shadow:0 20px 60px rgba(0,0,0,.45)` };
  if (kind === 'glass') return { layer: '', t: `background:rgba(255,255,255,.08);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:2px solid rgba(255,255,255,.18);padding:40px 70px;border-radius:40px` };
  if (kind === 'none') return { layer: '', t: '' };
  return { layer: `background:linear-gradient(180deg,${hex2rgba(sh, 0)} 0%,${hex2rgba(sh, .62)} 30%,${hex2rgba(sh, .7)} 50%,${hex2rgba(sh, .62)} 70%,${hex2rgba(sh, 0)} 100%)`, t: '' };
}
const LAYOUT_BOX = { 'center-band': [560, 800], 'top-bar': [180, 640], 'lower-third': [880, 560] };
function titleHTML(p, a, b, small, sizeK = 1) {
  const f = p.fonts, up = f.headline.upper;
  return `<div class="hl" style="font-size:${f.headline.size * sizeK}px">${words(up ? a.toUpperCase() : a)}</div>` +
    (b ? `<div class="ac" style="font-size:${f.accent.size * sizeK}px;margin-top:${-Math.round(f.accent.size * .29)}px">${words(b)}</div>` : '') +
    (small ? `<div class="sm" style="font-size:34px;margin-top:26px">${words(small)}</div>` : '');
}
function hookHTML(p) {
  const s = p.sample, f = p.fonts, L = p.hook.layout;
  if (L === 'none') return '';
  if (L === 'number') {
    const m = s.hookA.match(/^(\S+)\s*(.*)$/) || [, s.hookA, ''];
    return `<div class="ac" style="font-family:var(--hf);font-style:normal;font-weight:var(--hw);font-size:${f.headline.size * 2.1}px;line-height:.8">${words(m[1])}</div>` +
      `<div class="hl" style="font-size:${f.headline.size * .78}px">${words(f.headline.upper ? m[2].toUpperCase() : m[2])}</div>` +
      `<div class="ac" style="font-size:${f.accent.size * .8}px;margin-top:-20px">${words(s.hookB)}</div><div class="sm" style="font-size:34px;margin-top:24px">${words(s.hookC)}</div>`;
  }
  if (L === 'highlight-box') {
    return `<div><span class="pill">${esc(s.hookB.toUpperCase())}</span></div><div class="hl boxword" style="font-size:${f.headline.size * .9}px;filter:none">${words(s.hookA.toUpperCase())}</div>` +
      `<div class="sm" style="font-size:34px;margin-top:26px">${words(s.hookC)}</div>`;
  }
  if (L === 'question') {
    return `<div class="ac" style="font-size:${f.accent.size * .85}px;margin-bottom:6px">${words(s.hookC)}</div>` + titleHTML(p, s.hookA, s.hookB, '', .9);
  }
  return titleHTML(p, s.hookA, s.hookB, s.hookC);
}
function captionChunks(p) {
  const txt = p.sample.caption, max = p.captions.maxChars, out = [];
  for (const sent of txt.match(/[^.?!]+[.?!]?/g) || []) {
    let cur = '';
    for (const w of sent.trim().split(/\s+/)) {
      if (p.captions.style === 'word-pop') { cur = cur ? cur + ' ' + w : w; if (cur.split(' ').length >= 2) { out.push(cur); cur = ''; } continue; }
      if (cur && (cur + ' ' + w).length > max) { out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
    }
    if (cur) out.push(cur);
  }
  return out;
}
function captionHTML(p, text) {
  const k = p.captions;

    <div class="layer title" style="top:${box[0]}px;height:${box[1]}px;${tb.layer}"><div class="t" style="${tb.t}">${titleHTML(p, p.sample.titleA, p.sample.titleB, '')}</div></div>

// ---------------- motion (Web Animations; mirrors the renderer's GSAP specs) ----------------
const EASE = { expo: 'cubic-bezier(.16,1,.3,1)', back: 'cubic-bezier(.34,1.56,.64,1)', p3: 'cubic-bezier(.22,1,.36,1)', in: 'cubic-bezier(.55,0,1,.45)' };

function animateIn(layer, motion, kind, sfx) {
  const spec = SPEC[kind];

  spec.parts.forEach(([sel, delay, rise, blur, stagger]) => {
    layer.querySelectorAll(`${sel} .w, ${sel}.boxword .w`).forEach((w, i) => {
      const t0 = delay + i * stagger;

      if (motion === 'pop') { kf = [{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1)' }]; opt = { ...opt, duration: 520, delay: t0 * .6, easing: EASE.back }; }

      w.animate(kf, opt);
      last = Math.max(last, opt.delay + opt.duration * .7);

}

// ---------------- play the full sequence in the big preview ----------------
let timers = [];

let playing = false;
function playAll() {
  if (playing) { stopPlay(); refreshBig(); return; }
  playing = true; $('#playBtn').textContent = '■ Stop';
  const st = buildStage($('#bigPhone'), S, 'none', 340);
  const hook = st.querySelector('.hook'), title = st.querySelector('.title'), cap = st.querySelector('.cap');
  const x = S.extras.sfx, hasHook = S.hook.layout !== 'none';
  const hookLen = hasHook ? S.hook.minSeconds : 0, at = (s, fn) => timers.push(setTimeout(fn, s * 1000));
  const total = hookLen + 2 + S.visuals.titleMinHold + 2.5;
  if (S.extras.music !== 'none') pad(total, S.extras.musicDb);
  const wordSfx = (t, sel) => { if (x === 'premium') play(sel === '.ac' ? 'shimmer' : 'swish', t, sel === '.sm' ? .35 : .8); };
  if (hasHook) {
    hook.classList.add('show');
    animateIn(hook, S.hook.motion, 'hook', wordSfx);
    if (S.hook.sound === 'riser-impact' && x !== 'none') riser(0, hookLen - .05);
    if (S.hook.sound === 'hit' && x !== 'none') play('hit', 0, .8);
    at(hookLen - .6, () => animateOut(hook));
  }
  const t1 = hookLen;
  at(t1, () => {
    if (S.hook.sound === 'riser-impact' && x !== 'none' && hasHook) play('impact', 0, .9);
    if (x === 'premium' || x === 'minimal') play('swell', 0, .7);
    if (x === 'punchy') { play('whoosh', 0, 1); play('hit', .15, .6); }
    title.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450, fill: 'forwards' });
    const settle = animateIn(title, S.visuals.motion, 'title', (t, sel) => timers.push(setTimeout(() => wordSfx(0, sel), t * 1000)));
    at(settle + S.visuals.titleMinHold, () => { animateOut(title); if (x === 'premium') play('swish', 0, .4); });
  });
  if (S.captions.style !== 'none') {
    const chunks = captionChunks(S); let i = 0;
    const next = () => { if (!playing) return; const c = chunks[i++ % chunks.length]; cap.innerHTML = captionHTML(S, c); cap.classList.add('show'); cap.firstElementChild.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 120, fill: 'both' }); };

}

      bindRange('kY', (v) => S.captions.y = v, 'px'); bindRange('kC', (v) => S.captions.maxChars = v); bindRange('kS', (v) => S.captions.size = v, 'px');
      bindSelect('kF', (v) => { const [f, w] = v.split('|'); S.fonts.caption = { family: f, weight: +w }; });
      $('#kH').onchange = (e) => { S.captions.highlight = e.target.checked; touch(); };
      bigScene = 'caption'; refreshBig();
    },
  }),
  () => ({
    h: `<div class="eyebrow">Step 5 · Visuals</div><h2>Titles and look</h2><p class="desc">Where section titles sit, what's behind them, how they move, and the colour grade of the footage.</p>
      ${cardGrid(MOTIONS, null, 'title', () => false)}
      <div class="fine"><h4>Titles</h4>
        ${field('Title position', select('vL', LAYOUTS.map((o) => [o.id, o.name + ' · ' + o.note]), S.visuals.titleLayout))}
        ${field('Behind the title', select('vB', BACKINGS.map((o) => [o.id, o.name + ' · ' + o.note]), S.visuals.backing))}
        ${field('Fully on screen at least', range('vH', 2, 6, 0.5, S.visuals.titleMinHold, 's'), '+0.3 s per word past 3')}
        <h4>Look</h4>
        ${field('Colour grade', select('vG', [['natural', 'Natural'], ['warm', 'Warm'], ['cool', 'Cool'], ['bw', 'Black and white'], ['teal-orange', 'Teal and orange']], S.visuals.grade))}
        ${field('Pace', select('vP', [['tight', 'Tight: cut every stutter, short breaths'], ['natural', 'Natural: keep short pauses']], S.visuals.pace))}
        ${field('Punch-in zooms', select('vZ', [['off', 'Off'], ['subtle', 'Subtle on key lines']], S.visuals.punchIns))}
      </div>`,
    bind() {
      bindCards(MOTIONS, (p, o) => { p.visuals.motion = o.id; }, 'title', (o) => S.visuals.motion === o.id, 'title');
      bindSelect('vL', (v) => S.visuals.titleLayout = v); bindSelect('vB', (v) => S.visuals.backing = v); bindRange('vH', (v) => S.visuals.titleMinHold = v, 's');
      bindSelect('vG', (v) => S.visuals.grade = v); bindSelect('vP', (v) => S.visuals.pace = v); bindSelect('vZ', (v) => S.visuals.punchIns = v);
      bigScene = 'title'; refreshBig();
    },
  }),
  () => ({
    h: `<div class="eyebrow">Step 6 · Extras</div><h2>Sound and call to action</h2><p class="desc">Sound effects timed to the text, the music bed under your voice, and the comment keyword. Press Play on the left to hear it.</p>
      ${cardGrid(SFX, null, 'title', () => false)}
      <div class="fine"><h4>Music and CTA</h4>
        ${field('Music', select('xM', [['my-sounds-or-pad', 'Track from my-sounds, else a generated pad'], ['pad', 'Generated ambient pad'], ['none', 'No music']], S.extras.music))}
        ${field('Music level under voice', range('xD', -30, -12, 1, S.extras.musicDb, ' dB'))}
        ${field('Comment keyword', text('xK', S.extras.ctaKeyword))}
        <label class="toggle"><input type="checkbox" id="xP" ${S.extras.ctaPops ? 'checked' : ''}> Pop sound on each spoken keyword</label>
      </div>`,
    bind() {
      bindCards(SFX, (p, o) => { p.extras.sfx = o.id; }, 'title', (o) => S.extras.sfx === o.id);
      bindSelect('xM', (v) => S.extras.music = v); bindRange('xD', (v) => S.extras.musicDb = v, ' dB'); bindText('xK', (v) => S.extras.ctaKeyword = v);
      $('#xP').onchange = (e) => { S.extras.ctaPops = e.target.checked; touch(); };
    },
  }),
  () => {
    const c = S.colours, f = S.fonts, k = S.captions, v = S.visuals, x = S.extras, hk = S.hook;
    const h = `<div class="eyebrow">Step 7 · Watch</div><h2>Watch and save</h2><p class="desc">Press Play on the left to see the hook, a title, and captions together with sound. Save it, then tell your editor "edit this with ${esc(S.name)}".</p>
      <div class="summary">
        <b>Colours</b><span>${esc(c.name)} · accent <span style="color:${c.accent}">■</span> ${c.accent}</span>
        <b>Fonts</b><span>${esc(f.headline.family)} + ${esc(f.accent.family)}${f.accent.italic ? ' italic' : ''}</span>
        <b>Hook</b><span>${hk.layout}, ${hk.motion}, ${hk.minSeconds}-${hk.maxSeconds} s${hk.avoidAction ? ', avoids action' : ''}, ${hk.sound}</span>
        <b>Captions</b><span>${k.style}, max ${k.maxChars} chars, ${k.size}px at y ${k.y}, ${esc(f.caption.family)}</span>
        <b>Titles</b><span>${v.titleLayout}, ${v.backing}, ${v.motion}, hold ${v.titleMinHold} s+</span>
        <b>Look</b><span>${v.grade} grade, ${v.pace} pace, zooms ${v.punchIns}</span>
        <b>Sound</b><span>${x.sfx} SFX, music ${x.music} at ${x.musicDb} dB</span>
        <b>CTA</b><span>"${esc(x.ctaKeyword)}"${x.ctaPops ? ' with pops' : ''}</span>
      </div>
      <div class="fine"><h4>Save</h4>
        ${field('Style name', text('wN', S.name))}
        <label class="toggle"><input type="checkbox" id="wD" ${defaultSlug === S.slug ? 'checked' : ''}> Use this style by default for new edits</label>
        <div class="row"><button class="btn primary" id="wSave">Save style</button><span class="hint" id="wSlug">styles/${esc(S.slug)}.json</span></div>
      </div>
      <div class="saved">${saved.map((s) => `<div class="it"><span class="grow"><b>${esc(s.name)}</b> <span class="hint">${s.updated || ''}</span></span>${s.slug === defaultSlug ? '<span class="tag">Default</span>' : `<button class="btn" data-def="${s.slug}">Make default</button>`}<button class="btn" data-load="${s.slug}">Edit</button></div>`).join('')}</div>`;
    return { h, bind() {
      bindText('wN', (v) => { S.name = v; S.slug = slugify(v); $('#wSlug').textContent = `styles/${S.slug}.json`; $('#styleName').textContent = v; });
      $('#wSave').onclick = save;
      document.querySelectorAll('[data-def]').forEach((b) => b.onclick = async () => { const r = await (await fetch('/api/default', { method: 'POST', body: JSON.stringify({ slug: b.dataset.def }) })).json(); defaultSlug = r.default; go(7); toast('Default set'); });
      document.querySelectorAll('[data-load]').forEach((b) => b.onclick = async () => { S = await (await fetch('/api/styles/' + b.dataset.load)).json(); S.sample ||= structuredClone(SIGNATURE_GOLD.sample); $('#styleName').textContent = S.name; go(1); toast('Editing ' + S.name); });
    } };
  },
];
async function save() {
  if (!S.name.trim()) return toast('Give your style a name');
  S.slug = slugify(S.name); S.makeDefault = $('#wD').checked;
  const r = await (await fetch('/api/styles', { method: 'POST', body: JSON.stringify(S) })).json();
  if (r.error) return toast(r.error);
  delete S.makeDefault; saved = r.styles; defaultSlug = r.default; dirty = false; $('#saveState').textContent = 'Saved'; go(7); toast('Saved ' + S.name);
}

// ---------------- navigation ----------------
function go(i) {
  tab = Math.max(0, Math.min(TABS.length - 1, i)); visited.add(tab);
  $('#tabs').innerHTML = TABS.map((t, j) => `<button class="${j === tab ? 'on' : ''}" data-t="${j}">${j ? `<span class="n">${j}</span>` : ''}${t}${j && visited.has(j) && j !== tab ? '<span class="chk">✓</span>' : ''}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => go(+b.dataset.t));
  cardSpec = null;
  const st = STEPS[tab](); $('#step').innerHTML = st.h; st.bind();
  $('#progTxt').textContent = `Step ${tab + 1} of ${TABS.length}`; $('#progBar').style.width = ((tab + 1) / TABS.length * 100) + '%';
  $('#backBtn').style.visibility = tab ? 'visible' : 'hidden';
  $('#nextBtn').textContent = tab < TABS.length - 1 ? `Next: ${TABS[tab + 1]}` : 'Save style';
  $('#nextBtn').onclick = () => (tab < TABS.length - 1 ? go(tab + 1) : save());
  if (tab === 1 || tab === 2) bigScene = 'title';
  refreshBig();
}
$('#backBtn').onclick = () => go(tab - 1);
window.addEventListener('resize', () => renderCards());

(async () => {
  const st = await (await fetch('/api/state')).json();
  frames = st.frames; saved = st.styles; defaultSlug = st.default;
  if (defaultSlug) { try { S = await (await fetch('/api/styles/' + defaultSlug)).json(); S.sample ||= structuredClone(SIGNATURE_GOLD.sample); dirty = false; $('#saveState').textContent = 'Saved'; } catch {} }
  $('#styleName').textContent = S.name;
  await document.fonts.ready;
  go(0);
})();
</script>
</body>
</html>
